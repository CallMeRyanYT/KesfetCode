# Builds the signed Android app and publishes it as a GitHub Release.
#
# Release a new APK:  git tag v1.0.1 && git push origin v1.0.1
# or run "Android release" from the Actions tab and type a version.
#
# Day-to-day game changes do NOT need a new APK: pushing to main redeploys the
# website, and the installed apps download the new game the next time they open.
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, for example 1.0.1'
        required: true

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Stamp the game version and copy it into the app
        run: |
          node scripts/build-update.mjs --no-zip
          npx cap sync android

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No signing key. Run scripts/setup-android-signing.ps1 once on your PC."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk KesfetCode.apk
          cp KesfetCode.apk "KesfetCode-${{ steps.version.outputs.name }}.apk"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" KesfetCode.apk "KesfetCode-${{ steps.version.outputs.name }}.apk" --clobber
          else
            gh release create "$TAG" KesfetCode.apk "KesfetCode-${{ steps.version.outputs.name }}.apk" \
              --target "$GITHUB_SHA" --title "Keşfet Code $TAG" --notes-file .github/release-notes.md
          fi
